name: Hämta bilder

# Runs whenever a new request is pushed. The result goes to the "out" branch as a single
# commit that replaces the previous one, so old downloads never pile up in the history.
on:
  push:
    branches: [main]
    paths: ["requests/request.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download from Wikimedia Commons
        run: python3 scripts/fetch.py requests/request.json
      - name: Publish to the out branch
        run: |
          cd out
          git init -q -b out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bilder för $(python3 -c 'import json;print(json.load(open("../requests/request.json"))["id"])')"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out:out
